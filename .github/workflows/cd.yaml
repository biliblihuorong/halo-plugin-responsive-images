name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 0.1.1)"
        required: true

concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version, release notes and tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Not a version tag: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          configured_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "${configured_version%-SNAPSHOT}" != "$version" ]]; then
            echo "gradle.properties must declare $version or $version-SNAPSHOT" >&2
            exit 1
          fi
          notes="docs/releases/$TAG.md"
          test -s "$notes"
          if [[ "$(head -n 1 "$notes")" != "# $version" ]]; then
            echo "Release notes must start with '# $version'" >&2
            exit 1
          fi
          if tag_commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}" 2>/dev/null)"; then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $TAG points to another commit; refusing to replace its artifact" >&2
              exit 1
            fi
          fi
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; published artifacts will not be replaced" >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with the release version
        run: ./gradlew build -Pversion="${TAG#v}"
      - name: Verify the packaged version and calculate SHA-256
        run: |
          set -euo pipefail
          version="${TAG#v}"
          jar="build/libs/halo-plugin-responsive-images-$version.jar"
          python3 - "$version" "$jar" <<'PY'
          import re
          import sys
          import zipfile

          version, jar = sys.argv[1:]
          with zipfile.ZipFile(jar) as archive:
              manifest = archive.read("plugin.yaml").decode("utf-8")
              versions = [line.split(":", 1)[1].strip().strip("\"'")
                          for line in manifest.splitlines() if re.match(r"^\s+version:", line)]
              if versions != [version]:
                  raise SystemExit(f"plugin.yaml version {versions!r} does not match {version}")
              archive.getinfo("logo.png")
          print(f"Verified {jar}: plugin.yaml version {version}")
          PY
          (cd build/libs && sha256sum "halo-plugin-responsive-images-$version.jar" > "halo-plugin-responsive-images-$version.jar.sha256")
      - name: Publish a new release with its version notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jar="build/libs/halo-plugin-responsive-images-${TAG#v}.jar"
          gh release create "$TAG" "$jar" "$jar.sha256" \
            --title "$TAG" --notes-file "docs/releases/$TAG.md" --target "$GITHUB_SHA"
