apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: responsive-images
spec:
  enabled: true
  requires: ">=2.20.0"
  author:
    name: shell
    website: https://github.com/biliblihuorong
  logo: logo.png
  homepage: https://github.com/biliblihuorong/halo-plugin-responsive-images#readme
  repo: https://github.com/biliblihuorong/halo-plugin-responsive-images
  issues: https://github.com/biliblihuorong/halo-plugin-responsive-images/issues
  settingName: responsive-images-settings
  configMapName: responsive-images-configmap
  displayName: "ImgNest 响应式图片"
  description: "ImgNest 配套的社区 Halo 插件，为正文和主题图片补上 srcset；支持通用查询接口与 CDN URL 规则，ImgNest 图床适配可选，不依赖特定主题，不代表 Halo 官方。"
  license:
    - name: "MIT"
      url: "https://github.com/biliblihuorong/halo-plugin-responsive-images/blob/main/LICENSE"
